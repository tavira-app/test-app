spring:
  application:
    name: khodroban-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/khodroban}
    username: ${DB_USERNAME:khodroban}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint.health.show-details: never
